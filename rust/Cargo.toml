[workspace]
resolver = "2"
members = [
    "crates/celiums-cognition",
    "crates/celiums-memory-cli",
    "crates/celiums-memory-engine",
]

[workspace.package]
version = "3.0.0-alpha.0"
edition = "2024"
rust-version = "1.89.0"
license = "Apache-2.0"
repository = "https://github.com/terrizoaguimor/celiums-memory"
authors = ["Celiums Solutions LLC"]

[workspace.dependencies]
celiums-cognition = { path = "crates/celiums-cognition" }
# Hyphae is consumed as a published dependency, never vendored: the Hyphae
# repo explicitly keeps cognition out of its tree, and this repo keeps
# storage internals out of ours. Pinned exact: the 0.x contract can move.
hyphae-core = "=0.2.1"
hyphae-engine = "=0.2.1"
hyphae-query = "=0.2.1"
hyphae-retrieval = "=0.2.1"
hyphae-storage = "=0.2.1"
celiums-memory-engine = { path = "crates/celiums-memory-engine" }
# Same digest family as the Hyphae log; used for the journal chain.
blake3 = "1"
chacha20poly1305 = "0.10"
getrandom = "0.3"
axum = "0.8"
http-body-util = "0.1"
percent-encoding = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v7"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
