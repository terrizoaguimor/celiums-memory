[workspace]
resolver = "2"
members = [
    "crates/celiums-cognition",
    "crates/celiums-memory-cli",
    "crates/celiums-memory-engine",
]

[workspace.package]
version = "3.0.0-alpha.0"
edition = "2024"
rust-version = "1.89.0"
license = "Apache-2.0"
repository = "https://github.com/terrizoaguimor/celiums-memory"
authors = ["Celiums Solutions LLC"]
homepage = "https://celiums.ai"
documentation = "https://docs.rs/celiums-memory"
readme = "README.md"
keywords = ["memory", "cognitive", "mcp", "rust", "ai"]
categories = ["database", "science", "wasm"]

[workspace.dependencies]
celiums-cognition = { version = "=3.0.0-alpha.0", path = "crates/celiums-cognition" }
# Hyphae is consumed from the immutable v1.0.0 release commit, never vendored.
# Switch these sources to exact crates.io versions after Hyphae publishes v1.
hyphae-core = { git = "https://github.com/celiumsai/hyphae.git", tag = "v1.0.0", version = "=1.0.0" }
hyphae-engine = { git = "https://github.com/celiumsai/hyphae.git", tag = "v1.0.0", version = "=1.0.0" }
hyphae-query = { git = "https://github.com/celiumsai/hyphae.git", tag = "v1.0.0", version = "=1.0.0" }
hyphae-retrieval = { git = "https://github.com/celiumsai/hyphae.git", tag = "v1.0.0", version = "=1.0.0" }
hyphae-storage = { git = "https://github.com/celiumsai/hyphae.git", tag = "v1.0.0", version = "=1.0.0" }
celiums-memory-engine = { version = "=3.0.0-alpha.0", path = "crates/celiums-memory-engine" }
# Same digest family as the Hyphae log; used for the journal chain.
blake3 = "1"
chacha20poly1305 = "0.10"
getrandom = "0.3"
axum = "0.8"
http-body-util = "0.1"
percent-encoding = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v7"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
