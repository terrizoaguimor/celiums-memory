# SPDX-License-Identifier: Apache-2.0
# Celiums Memory release pipeline — implements ADR-018 §"Tag v*.*.*".
#
# On tag push (v*.*.*):
#   1. Run Rust and active TypeScript checks
#   2. Build the Cloudflare Container image
#   3. Publish the native Rust crates

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/celiums-memory

jobs:
  # ── Tests must pass on the tagged commit ─────────────────────────
  test:
    name: Tests (pre-release gate)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/cloudflare-worker typecheck
      - run: pnpm --dir apps/cloudflare-worker test
      - run: pnpm --dir packages/memory-bench typecheck
      - run: pnpm --dir packages/plugin-claude-code check
      - run: cargo check --manifest-path rust/Cargo.toml --workspace --locked

  # ── Build + push Cloudflare Container image ───────────────────────
  docker:
    name: Build + push image
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write    # cosign keyless OIDC
    outputs:
      image-digest: ${{ steps.push.outputs.digest }}
      image-tags:   ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
      - name: Build + push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/cloudflare-worker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          provenance: true
          sbom:       true

      # ── Scan image (Trivy) ──────────────────────────────────────
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'
      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif

      # ── Generate SBOMs (Syft) ───────────────────────────────────
      - name: Syft SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: celiums-memory.spdx.json
      - name: Syft SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: celiums-memory.cdx.json

      # ── cosign keyless sign ─────────────────────────────────────
      - uses: sigstore/cosign-installer@v3
      - name: cosign sign image + attach SBOM
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          cosign attest --yes \
            --predicate celiums-memory.spdx.json \
            --type spdxjson \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          cosign attest --yes \
            --predicate celiums-memory.cdx.json \
            --type cyclonedx \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}

      # ── Upload artefacts to workflow run ────────────────────────
      - uses: actions/upload-artifact@v4
        with:
          name: sboms
          path: |
            celiums-memory.spdx.json
            celiums-memory.cdx.json

  # ── Publish Rust crates ───────────────────────────────────────────
  publish-crates:
    name: Publish native Rust crates
    needs: [test, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write    # for SLSA provenance attestation
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish --manifest-path rust/crates/celiums-cognition/Cargo.toml --locked
          sleep 30
          cargo publish --manifest-path rust/crates/celiums-memory-engine/Cargo.toml --locked
          sleep 30
          cargo publish --manifest-path rust/crates/celiums-memory-cli/Cargo.toml --locked

  # ── Final release notes update ───────────────────────────────────
  release-notes:
    name: Append SBOM + signatures to release
    needs: [docker, publish-crates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sboms
          path: /tmp/sboms
      - name: Attach SBOM to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            /tmp/sboms/celiums-memory.spdx.json
            /tmp/sboms/celiums-memory.cdx.json
